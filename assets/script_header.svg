      <rect x="0" y="0" width="30" height="38" opacity="0.06"/><rect x="32" y="0" width="30" height="38" opacity="0.06"/><rect x="64" y="0" width="30" height="38" opacity="0.06"/><rect x="96" y="0" width="30" height="38" opacity="0.08"/><rect x="128" y="0" width="30" height="38" opacity="0.12"/><rect x="160" y="0" width="30" height="38" opacity="0.2"/><rect x="192" y="0" width="30" height="38" opacity="0.4"/><rect x="224" y="0" width="30" height="38" opacity="0.68"/><rect x="256" y="0" width="30" height="38" opacity="0.9"/><rect x="288" y="0" width="30" height="38" opacity="1"/>
