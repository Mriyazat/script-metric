<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="300" viewBox="0 0 1280 300">
  <rect width="1280" height="300" rx="14" fill="#F5F3EE"/>
  <rect x="0.5" y="0.5" width="1279" height="299" rx="14" fill="none" stroke="#e3e0d8"/>
  <text x="64" y="72" font-family="Menlo, Consolas, monospace" font-size="11" letter-spacing="1.6" fill="#7d8c96">SCRIPT  -  STRUCTURAL CHOREOGRAPHY AND RIGIDITY INDEX FROM POSITIONS AND TRANSITIONS</text>
  <text x="64" y="146" font-family="Georgia, Times New Roman, serif" font-size="40" font-weight="600" fill="#1b2a33">Do LLMs Follow a Behavioral SCRIPT?</text>
  <text x="64" y="188" font-family="Georgia, Times New Roman, serif" font-size="19" font-style="italic" fill="#405260">Measuring Structural Choreography and Rigidity from Positions and Transitions</text>
  <line x1="64" y1="232" x2="700" y2="232" stroke="#e3e0d8"/>
  <text x="64" y="262" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#405260"><tspan fill="#00798c">empathy</tspan> opens, <tspan fill="#d1495b">advice</tspan> fills the middle, <tspan fill="#5d9478">questions</tspan> close: the same seats in every response, whoever wrote in.</text>
