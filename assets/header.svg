<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="300" viewBox="0 0 1280 300">
  <!-- stage -->
  <rect width="1280" height="300" rx="14" fill="#161f26"/>
  <rect x="0.5" y="0.5" width="1279" height="299" rx="14" fill="none" stroke="#2a3740"/>

  <!-- kicker -->
  <text x="64" y="72" font-family="IBM Plex Mono, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="2.4" fill="#8b9aa4">SCRIPT · STRUCTURAL CHOREOGRAPHY &amp; RIGIDITY INDEX FROM POSITIONS AND TRANSITIONS</text>

  <!-- title -->
  <text x="64" y="150" font-family="IBM Plex Serif, Georgia, Times New Roman, serif" font-size="46" font-weight="600" fill="#e9eef1">Measuring behavioural scriptedness</text>
  <text x="64" y="200" font-family="IBM Plex Serif, Georgia, Times New Roman, serif" font-size="46" font-weight="600" fill="#e9eef1">from span annotations</text>

  <!-- rule -->
  <line x1="64" y1="232" x2="700" y2="232" stroke="#2a3740"/>

  <!-- dek -->
  <text x="64" y="262" font-family="IBM Plex Sans, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#b8c6cf">
    <tspan fill="#4db8c9">empathy</tspan> opens, <tspan fill="#e8798a">advice</tspan> fills the middle, <tspan fill="#7bbd98">questions</tspan> close  the same seats in every response, whoever wrote in.
  </text>

  <!-- heat grid: three behaviour groups × ten seats of the response -->
  <g transform="translate(840,64)">
    <text x="0" y="-14" font-family="IBM Plex Mono, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" letter-spacing="1.8" fill="#8b9aa4">WHERE EACH BEHAVIOUR SITS · TEN SEATS</text>
    <rect x="-1" y="-1" width="378" height="122" fill="#222d35"/>
    <g fill="#4db8c9">
      <rect x="0"   y="0" width="36" height="38" opacity="1"/>
      <rect x="38"  y="0" width="36" height="38" opacity=".8"/>
      <rect x="76"  y="0" width="36" height="38" opacity=".5"/>
      <rect x="114" y="0" width="36" height="38" opacity=".28"/>
      <rect x="152" y="0" width="36" height="38" opacity=".14"/>
      <rect x="190" y="0" width="36" height="38" opacity=".08"/>
      <rect x="228" y="0" width="36" height="38" opacity=".06"/>
      <rect x="266" y="0" width="36" height="38" opacity=".06"/>
      <rect x="304" y="0" width="36" height="38" opacity=".06"/>
      <rect x="342" y="0" width="36" height="38" opacity=".06"/>
    </g>
    <g fill="#e8798a" transform="translate(0,41)">
      <rect x="0"   y="0" width="36" height="38" opacity=".06"/>
      <rect x="38"  y="0" width="36" height="38" opacity=".12"/>
      <rect x="76"  y="0" width="36" height="38" opacity=".38"/>
      <rect x="114" y="0" width="36" height="38" opacity=".78"/>
      <rect x="152" y="0" width="36" height="38" opacity="1"/>
      <rect x="190" y="0" width="36" height="38" opacity="1"/>
      <rect x="228" y="0" width="36" height="38" opacity=".74"/>
      <rect x="266" y="0" width="36" height="38" opacity=".38"/>
      <rect x="304" y="0" width="36" height="38" opacity=".14"/>
      <rect x="342" y="0" width="36" height="38" opacity=".06"/>
    </g>
    <g fill="#7bbd98" transform="translate(0,82)">
      <rect x="0"   y="0" width="36" height="38" opacity=".06"/>
      <rect x="38"  y="0" width="36" height="38" opacity=".06"/>
      <rect x="76"  y="0" width="36" height="38" opacity=".06"/>
      <rect x="114" y="0" width="36" height="38" opacity=".08"/>
      <rect x="152" y="0" width="36" height="38" opacity=".12"/>
      <rect x="190" y="0" width="36" height="38" opacity=".2"/>
      <rect x="228" y="0" width="36" height="38" opacity=".4"/>
      <rect x="266" y="0" width="36" height="38" opacity=".68"/>
      <rect x="304" y="0" width="36" height="38" opacity=".9"/>
      <rect x="342" y="0" width="36" height="38" opacity="1"/>
    </g>
    <g font-family="IBM Plex Mono, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#8b9aa4">
      <text x="0" y="140">start</text>
      <text x="378" y="140" text-anchor="end">end of the response</text>
      <text x="-10" y="24" text-anchor="end" fill="#4db8c9">empathy</text>
      <text x="-10" y="65" text-anchor="end" fill="#e8798a">advice</text>
      <text x="-10" y="106" text-anchor="end" fill="#7bbd98">questions</text>
    </g>
  </g>
</svg>
